services:
  db:
    image: postgres:17
    container_name: sql-practicum-pg
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: market
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
