services:
  db:
    image: postgres:17
    container_name: study-pg
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    ports:
      - "55432:5432"
    command:
      - postgres
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
